<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="stylesheet" href="../css/inventory.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div data-include="../compoments/sidebar.html"></div>

  <div class="main">
    <div class="navbar">
      <h1>Inventory</h1>
      <button onclick="openModal()">+ Add Product</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productTable">
          <tr><td colspan="5" style="text-align:center;padding:20px;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:999;">
    <div class="modal-content">
      <h2>Add Product</h2>
      <input type="text" id="name" placeholder="Product Name">
      <input type="number" id="price" placeholder="Price">
      <input type="number" id="stock" placeholder="Stock">
      <select id="category" style="width:100%;padding:12px;margin-bottom:15px;border:1px solid #ddd;border-radius:10px;">
        <option value="">Select Category</option>
      </select>
      <input type="file" id="image" accept="image/*" style="margin-bottom:15px;">
      <button onclick="addProduct()">Save Product</button>
      <button onclick="document.getElementById('modal').style.display='none'" style="background:#6b7280;margin-top:8px;">Cancel</button>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/imageUtils.js"></script>
  <script src="../js/include.js"></script>
  <script src="../js/inventory.js"></script>
</body>
</html>
