<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>
  <link rel="stylesheet" href="../css/checkout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div data-include="../compoments/sidebar.html"></div>
  <div class="main">
    <div data-include="../compoments/navbad.html"></div>

    <div class="order-summary-container">
      <h1>Order Summary</h1>

      <div class="summary">
        <h2>Order Summary</h2>

        <div class="product-summary">
          <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853" alt="Laptop">
          <div>
            <h4>Laptop</h4>
            <p>Qty: 1</p>
          </div>
          <span>$500</span>
        </div>

        <div class="product-summary">
          <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Phone">
          <div>
            <h4>Phone</h4>
            <p>Qty: 1</p>
          </div>
          <span>$300</span>
        </div>

        <hr>

        <div class="summary-item">
          <span>Subtotal</span>
          <span>$800</span>
        </div>
        <div class="summary-item">
          <span>Shipping</span>
          <span>$20</span>
        </div>
        <div class="summary-item">
          <span>Tax</span>
          <span>$10</span>
        </div>
        <div class="summary-item total">
          <span>Total</span>
          <span>$830</span>
        </div>

        <div class="coupon">
          <input type="text" placeholder="Promo code">
          <button>Apply</button>
        </div>

        <button class="checkout-btn" onclick="placeOrder()">Place Order</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/include.js"></script>
  <script src="../js/checkout.js"></script>
</body>

</html>
